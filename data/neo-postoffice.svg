<?xml version="1.0" encoding="UTF-8"?>
<!-- Neo-PostOffice icon: an envelope with a stamp. LGPL-2.1, like the program. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ea"/>
      <stop offset="1" stop-color="#e9dfc2"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead0"/>
      <stop offset="1" stop-color="#ddd0aa"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <rect x="22" y="62" width="220" height="154" rx="10" fill="#000" opacity="0.18"/>
  <!-- envelope body -->
  <rect x="14" y="52" width="220" height="154" rx="10" fill="url(#paper)" stroke="#6b5a35" stroke-width="6"/>
  <!-- lower folds -->
  <path d="M 18 200 L 104 128 M 230 200 L 144 128" stroke="#a8966a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- flap -->
  <path d="M 17 58 L 124 140 L 231 58" fill="url(#flap)" stroke="#6b5a35" stroke-width="6" stroke-linejoin="round"/>
  <!-- stamp, with a perforated edge -->
  <g transform="rotate(-6 196 70)">
    <rect x="160" y="26" width="72" height="88" fill="#fff" stroke="#8a2a1c" stroke-width="3"
          stroke-dasharray="5 4"/>
    <rect x="168" y="34" width="56" height="72" fill="#c8402c"/>
    <!-- sun and hills -->
    <circle cx="210" cy="52" r="9" fill="#fdf3d8"/>
    <path d="M 168 106 L 168 90 L 186 68 L 200 84 L 210 76 L 224 92 L 224 106 Z" fill="#fdf3d8"/>
  </g>
  <!-- postmark -->
  <circle cx="150" cy="96" r="24" fill="none" stroke="#2f4f7a" stroke-width="5" opacity="0.7"/>
  <circle cx="150" cy="96" r="15" fill="none" stroke="#2f4f7a" stroke-width="3" opacity="0.7"/>
</svg>
